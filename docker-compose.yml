services:
  n8n:
    image: n8nio/n8n:1.82.3
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # Workflows read these via $env. Never put the real values in exported JSON.
      LENDLOOP_WEBHOOK_SECRET: ${LENDLOOP_WEBHOOK_SECRET}
      LENDLOOP_CONVEX_SITE_URL: ${CONVEX_SITE_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    # The editor is bound to localhost via the published port. Do not
    # expose this container to the public internet without additional
    # access control (see README).

volumes:
  n8n_data:
